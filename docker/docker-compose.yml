# Gerado por gerar.py 
x-base: &base
  build: .
  image: fl-ids-artigo

services:
  servidor:
    <<: *base
    command: python servidor.py
    environment: {N: 5, NT: 20, RODADAS: 2}
    volumes: [./dados/teste.npz:/dados/teste.npz:ro]
  cliente0:
    <<: *base
    command: python cliente.py
    environment: {CID: 0, E: 1, B: 16}
    volumes: [./dados/cliente_0.npz:/dados/particao.npz:ro]
    mem_limit: 400m
    cpus: 0.5
    depends_on: [servidor]
    restart: on-failure
